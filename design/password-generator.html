<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SafeVault — 密码生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--fg:#1A1A1A;--fg-2:#6B7280;--muted:#9CA3AF;
  --border:#E5E7EB;--border-soft:#F3F4F6;--accent:#5E6AD2;--accent-hover:#4F5BC0;
  --accent-light:#EDEDFB;--success:#22C55E;--success-light:#DCFCE7;
  --warn:#F59E0B;--warn-light:#FEF3C7;--danger:#EF4444;--danger-light:#FEE2E2;
  --sidebar-w:60px;--topbar-h:52px;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:13px;color:var(--fg);background:var(--bg)}
.app{display:flex;height:100vh}

.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.sidebar-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex-shrink:0}
.sidebar-logo svg{width:18px;height:18px}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.sidebar-link{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);text-decoration:none;transition:all .15s;cursor:pointer}
.sidebar-link:hover{background:var(--border-soft);color:var(--fg-2)}
.sidebar-link.active{background:var(--accent-light);color:var(--accent)}
.sidebar-link svg{width:20px;height:20px}
.sidebar-bottom{display:flex;flex-direction:column;gap:2px;margin-top:auto}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:600;color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.topbar-spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--fg-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border-soft)}
.btn svg{width:15px;height:15px}
.btn-lg{height:40px;padding:0 20px;font-size:14px;border-radius:8px}

.content-scroll{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:40px}
.gen-container{width:100%;max-width:560px}

.gen-title{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--fg);margin-bottom:4px}
.gen-desc{font-size:13px;color:var(--fg-2);margin-bottom:28px}

/* Output box */
.gen-output{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;position:relative}
.gen-output-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
.gen-password-display{
  font-family:var(--mono);font-size:22px;font-weight:500;color:var(--fg);
  letter-spacing:.03em;line-height:1.4;word-break:break-all;
  padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  min-height:56px;display:flex;align-items:center;position:relative;
}
.gen-password-display .char-upper{color:var(--accent)}
.gen-password-display .char-digit{color:var(--success)}
.gen-password-display .char-symbol{color:var(--warn)}
.gen-output-actions{display:flex;gap:8px;margin-top:12px}

/* Strength meter */
.gen-strength{display:flex;align-items:center;gap:10px;margin-top:16px}
.gen-strength-bars{display:flex;gap:3px;flex:1}
.gen-strength-bars span{height:4px;flex:1;border-radius:2px;background:var(--border);transition:background .3s}
.gen-strength-bars.strong span{background:var(--success)}
.gen-strength-bars.medium span:nth-child(-n+3){background:var(--warn)}
.gen-strength-bars.weak span:nth-child(-n+1){background:var(--danger)}
.gen-strength-label{font-size:12px;font-weight:500;white-space:nowrap}
.gen-strength-label.strong{color:var(--success)}
.gen-strength-label.medium{color:var(--warn)}
.gen-strength-label.weak{color:var(--danger)}
.gen-entropy{font-size:11px;color:var(--muted);margin-left:auto}

/* Options */
.gen-options{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.gen-option-group{margin-bottom:20px}
.gen-option-group:last-child{margin-bottom:0}
.gen-option-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gen-option-label span{font-size:13px;font-weight:500;color:var(--fg)}
.gen-option-value{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}

/* Range slider */
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;transition:background .15s}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle-row span{font-size:13px;color:var(--fg)}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-track::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle input:checked+.toggle-track::after{transform:translateX(16px)}

/* History */
.gen-history{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.gen-history-title{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:12px}
.history-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.history-item:last-child{border-bottom:none}
.history-pwd{font-family:var(--mono);font-size:13px;color:var(--fg);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-time{font-size:11px;color:var(--muted);white-space:nowrap}
.history-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.history-btn:hover{background:var(--border-soft);color:var(--fg-2)}
.history-btn svg{width:14px;height:14px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;display:none;align-items:center;gap:8px;z-index:100;animation:toast-in .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{display:flex}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" data-od-id="sidebar">
    <div class="sidebar-logo"><svg viewBox="0 0 18 18" fill="none"><path d="M9 1L3 4.5v5c0 4 2.5 6.5 6 8 3.5-1.5 6-4 6-8v-5L9 1z" fill="#fff" fill-opacity=".9"/><path d="M7 8.5l1.5 1.5L11 7" stroke="#5E6AD2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="sidebar-nav">
      <a class="sidebar-link" title="密码库" href="vault-home.html"><svg viewBox="0 0 20 20" fill="none"><path d="M4 5a2 2 0 012-2h8a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="1.5"/><path d="M8 9h4M8 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="5" r="1" fill="currentColor"/></svg></a>
      <a class="sidebar-link active" title="密码生成器" href="password-generator.html"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2v4m0 8v4M2 10h4m8 0h4M4.93 4.93l2.83 2.83m4.48 4.48l2.83 2.83M15.07 4.93l-2.83 2.83M7.76 12.22l-2.83 2.83" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a class="sidebar-link" title="密码健康" href="password-health.html"><svg viewBox="0 0 20 20" fill="none"><path d="M3 10a7 7 0 1114 0 7 7 0 01-14 0z" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
    </div>
    <div class="sidebar-bottom">
      <a class="sidebar-link" title="设置" href="settings.html"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2m0 12v2m-5.66-2.34l1.42-1.42m8.48-8.48l1.42-1.42M2 10h2m12 0h2M4.34 4.34l1.42 1.42m8.48 8.48l1.42 1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar" data-od-id="topbar">
      <span class="topbar-title">密码生成器</span>
      <span class="topbar-spacer"></span>
    </div>
    <div class="content-scroll">
      <div class="gen-container" data-od-id="generator">
        <div class="gen-title">密码生成器</div>
        <div class="gen-desc">生成安全的随机密码，自定义长度和字符类型。</div>

        <div class="gen-output" data-od-id="gen-output">
          <div class="gen-output-label">生成结果</div>
          <div class="gen-password-display" id="pwd-display">
            <span class="char-upper">K</span><span class="char-digit">7</span><span>mN</span><span class="char-symbol">#</span><span>pQ</span><span class="char-digit">4</span><span>xR</span><span class="char-symbol">!</span><span class="char-upper">L</span><span class="char-digit">2</span><span>wT</span><span class="char-symbol">@</span><span class="char-digit">9</span><span>fH</span>
          </div>
          <div class="gen-output-actions">
            <button class="btn btn-primary" onclick="generatePwd()">
              <svg viewBox="0 0 15 15" fill="none"><path d="M7.5 2v3m0 5v3M2 7.5h3m5 0h3M3.6 3.6l2.12 2.12m3.56 3.56l2.12 2.12M11.4 3.6l-2.12 2.12M5.72 9.28L3.6 11.4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>
              重新生成
            </button>
            <button class="btn btn-ghost" onclick="showToast('已复制到剪贴板')">
              <svg viewBox="0 0 15 15" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 5V3.5A1.5 1.5 0 008.5 2h-5A1.5 1.5 0 002 3.5v5A1.5 1.5 0 003.5 10H5" stroke="currentColor" stroke-width="1.3"/></svg>
              复制
            </button>
          </div>
          <div class="gen-strength">
            <div class="gen-strength-bars strong" id="gen-bars"><span></span><span></span><span></span><span></span></div>
            <span class="gen-strength-label strong" id="gen-label">强密码</span>
            <span class="gen-entropy">≈ 85.4 位熵</span>
          </div>
        </div>

        <div class="gen-options" data-od-id="gen-options">
          <div class="gen-option-group">
            <div class="gen-option-label">
              <span>密码长度</span>
              <span class="gen-option-value" id="len-val">16</span>
            </div>
            <input type="range" min="8" max="64" value="16" id="len-slider" oninput="document.getElementById('len-val').textContent=this.value">
          </div>
          <div class="gen-option-group">
            <div class="gen-option-label"><span>字符类型</span></div>
            <div class="toggle-row">
              <span>大写字母 (A-Z)</span>
              <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
            </div>
            <div class="toggle-row">
              <span>小写字母 (a-z)</span>
              <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
            </div>
            <div class="toggle-row">
              <span>数字 (0-9)</span>
              <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
            </div>
            <div class="toggle-row">
              <span>特殊符号 (!@#$%)</span>
              <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
            </div>
          </div>
          <div class="gen-option-group">
            <div class="gen-option-label"><span>排除易混淆字符</span></div>
            <div class="toggle-row">
              <span>排除 l, 1, I, O, 0</span>
              <label class="toggle"><input type="checkbox"><span class="toggle-track"></span></label>
            </div>
          </div>
        </div>

        <div class="gen-history" data-od-id="gen-history">
          <div class="gen-history-title">最近生成</div>
          <div class="history-item">
            <span class="history-pwd">K7mN#pQ4xR!L2wT@9fH</span>
            <span class="history-time">刚刚</span>
            <button class="history-btn" title="复制" onclick="showToast('已复制')"><svg viewBox="0 0 15 15" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 5V3.5A1.5 1.5 0 008.5 2h-5A1.5 1.5 0 002 3.5v5A1.5 1.5 0 003.5 10H5" stroke="currentColor" stroke-width="1.3"/></svg></button>
          </div>
          <div class="history-item">
            <span class="history-pwd">Yp$2kL!mN8xQ@4wR</span>
            <span class="history-time">3 分钟前</span>
            <button class="history-btn" title="复制" onclick="showToast('已复制')"><svg viewBox="0 0 15 15" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 5V3.5A1.5 1.5 0 008.5 2h-5A1.5 1.5 0 002 3.5v5A1.5 1.5 0 003.5 10H5" stroke="currentColor" stroke-width="1.3"/></svg></button>
          </div>
          <div class="history-item">
            <span class="history-pwd">R#9fH!L2wT@K7mN4xQ</span>
            <span class="history-time">12 分钟前</span>
            <button class="history-btn" title="复制" onclick="showToast('已复制')"><svg viewBox="0 0 15 15" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 5V3.5A1.5 1.5 0 008.5 2h-5A1.5 1.5 0 002 3.5v5A1.5 1.5 0 003.5 10H5" stroke="currentColor" stroke-width="1.3"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000)}
var chars={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower:'abcdefghijklmnopqrstuvwxyz',digits:'0123456789',symbols:'!@#$%^&*()-_=+[]{}|;:,.<>?'};
function generatePwd(){
  var len=parseInt(document.getElementById('len-slider').value);
  var pool='';pool+=chars.upper+chars.lower+chars.digits+chars.symbols;
  var pwd='';for(var i=0;i<len;i++){pwd+=pool[Math.floor(Math.random()*pool.length)]}
  var display=document.getElementById('pwd-display');display.innerHTML='';
  for(var i=0;i<pwd.length;i++){var s=document.createElement('span');s.textContent=pwd[i];
    if(/[A-Z]/.test(pwd[i]))s.className='char-upper';
    else if(/[0-9]/.test(pwd[i]))s.className='char-digit';
    else if(/[^A-Za-z0-9]/.test(pwd[i]))s.className='char-symbol';
    display.appendChild(s)}
}
generatePwd();
</script>
</body>
</html>
