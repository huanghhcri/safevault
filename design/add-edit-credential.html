<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SafeVault — 添加凭证</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--fg:#1A1A1A;--fg-2:#6B7280;--muted:#9CA3AF;
  --border:#E5E7EB;--border-soft:#F3F4F6;--accent:#5E6AD2;--accent-hover:#4F5BC0;
  --accent-light:#EDEDFB;--success:#22C55E;--success-light:#DCFCE7;
  --warn:#F59E0B;--warn-light:#FEF3C7;--danger:#EF4444;--danger-light:#FEE2E2;
  --sidebar-w:60px;--topbar-h:52px;
  --font:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:13px;color:var(--fg);background:var(--bg)}
.app{display:flex;height:100vh}

.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.sidebar-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex-shrink:0}
.sidebar-logo svg{width:18px;height:18px}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.sidebar-link{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);text-decoration:none;transition:all .15s;cursor:pointer}
.sidebar-link:hover{background:var(--border-soft);color:var(--fg-2)}
.sidebar-link.active{background:var(--accent-light);color:var(--accent)}
.sidebar-link svg{width:20px;height:20px}
.sidebar-bottom{display:flex;flex-direction:column;gap:2px;margin-top:auto}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:600;color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2);cursor:pointer;background:none;border:none;font-family:var(--font);padding:4px 8px;border-radius:6px;transition:all .15s}
.topbar-back:hover{background:var(--border-soft);color:var(--fg)}
.topbar-back svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--fg-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border-soft)}
.btn svg{width:15px;height:15px}

.form-scroll{flex:1;overflow-y:auto;padding:32px 40px}
.form-container{max-width:600px}
.form-title{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--fg);margin-bottom:4px}
.form-desc{font-size:13px;color:var(--fg-2);margin-bottom:28px}

.form-group{margin-bottom:20px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--fg-2);margin-bottom:6px;letter-spacing:.01em}
.form-input{width:100%;height:36px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-size:13px;font-family:var(--font);color:var(--fg);background:var(--surface);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--muted)}
.form-input.mono{font-family:var(--mono);letter-spacing:.02em}
textarea.form-input{height:80px;padding:10px 12px;resize:vertical;line-height:1.5}

.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}

.form-select{width:100%;height:36px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-size:13px;font-family:var(--font);color:var(--fg);background:var(--surface);outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 4.5l3 3 3-3' stroke='%239CA3AF' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;transition:border-color .15s}
.form-select:focus{border-color:var(--accent)}

.password-field{position:relative}
.password-field .form-input{padding-right:72px}
.password-actions{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.pwd-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.pwd-btn:hover{background:var(--border-soft);color:var(--fg-2)}
.pwd-btn svg{width:15px;height:15px}

.strength-indicator{margin-top:8px}
.strength-bar-row{display:flex;gap:3px;align-items:center}
.strength-bar-row span{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .2s}
.strength-bar-row.strong span{background:var(--success)}
.strength-bar-row.medium span:nth-child(-n+3){background:var(--warn)}
.strength-bar-row.weak span:nth-child(-n+1){background:var(--danger)}
.strength-text{font-size:11px;font-weight:500;margin-top:4px}
.strength-text.strong{color:var(--success)}
.strength-text.medium{color:var(--warn)}
.strength-text.weak{color:var(--danger)}

.tag-selector{display:flex;gap:8px;flex-wrap:wrap}
.tag-option{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:500;font-family:var(--font);color:var(--fg-2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.tag-option:hover{background:var(--border-soft)}
.tag-option.selected{background:var(--fg);color:var(--surface);border-color:var(--fg)}

.form-section-divider{height:1px;background:var(--border);margin:24px 0}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:32px;padding-top:20px;border-top:1px solid var(--border)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;display:none;align-items:center;gap:8px;z-index:100;animation:toast-in .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{display:flex}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" data-od-id="sidebar">
    <div class="sidebar-logo"><svg viewBox="0 0 18 18" fill="none"><path d="M9 1L3 4.5v5c0 4 2.5 6.5 6 8 3.5-1.5 6-4 6-8v-5L9 1z" fill="#fff" fill-opacity=".9"/><path d="M7 8.5l1.5 1.5L11 7" stroke="#5E6AD2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="sidebar-nav">
      <a class="sidebar-link" title="密码库" href="vault-home.html"><svg viewBox="0 0 20 20" fill="none"><path d="M4 5a2 2 0 012-2h8a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="1.5"/><path d="M8 9h4M8 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="5" r="1" fill="currentColor"/></svg></a>
      <a class="sidebar-link" title="密码生成器" href="password-generator.html"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2v4m0 8v4M2 10h4m8 0h4M4.93 4.93l2.83 2.83m4.48 4.48l2.83 2.83M15.07 4.93l-2.83 2.83M7.76 12.22l-2.83 2.83" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
      <a class="sidebar-link" title="密码健康" href="password-health.html"><svg viewBox="0 0 20 20" fill="none"><path d="M3 10a7 7 0 1114 0 7 7 0 01-14 0z" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
    </div>
    <div class="sidebar-bottom">
      <a class="sidebar-link" title="设置" href="settings.html"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2m0 12v2m-5.66-2.34l1.42-1.42m8.48-8.48l1.42-1.42M2 10h2m12 0h2M4.34 4.34l1.42 1.42m8.48 8.48l1.42 1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
    </div>
  </nav>
  <div class="main">
    <div class="topbar" data-od-id="topbar">
      <button class="topbar-back" onclick="window.location.href='vault-home.html'">
        <svg viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        返回密码库
      </button>
      <span class="topbar-title" style="margin-left:12px">添加凭证</span>
      <span class="topbar-spacer"></span>
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="window.location.href='vault-home.html'">取消</button>
        <button class="btn btn-primary" onclick="showToast('凭证已保存')">
          <svg viewBox="0 0 15 15" fill="none"><path d="M3 7.5l3.5 3.5L12 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          保存凭证
        </button>
      </div>
    </div>
    <div class="form-scroll">
      <div class="form-container" data-od-id="add-form">
        <div class="form-title">新建凭证</div>
        <div class="form-desc">填写以下信息以安全存储您的登录凭证。</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">名称</label>
            <input class="form-input" type="text" placeholder="例如：GitHub" data-od-id="field-name">
          </div>
          <div class="form-group">
            <label class="form-label">分类</label>
            <select class="form-select" data-od-id="field-category">
              <option>账户</option>
              <option>服务器</option>
              <option>令牌</option>
              <option>其他</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">网址</label>
          <input class="form-input" type="url" placeholder="https://example.com" data-od-id="field-url">
        </div>

        <div class="form-group">
          <label class="form-label">用户名 / 邮箱</label>
          <input class="form-input" type="text" placeholder="user@example.com" data-od-id="field-username">
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="password-field">
            <input class="form-input mono" type="password" placeholder="输入密码" id="pwd-input" data-od-id="field-password" oninput="updateStrength()">
            <div class="password-actions">
              <button class="pwd-btn" title="显示" onclick="togglePwd()"><svg viewBox="0 0 15 15" fill="none"><path d="M1 7.5s2.5-4.5 6.5-4.5S14 7.5 14 7.5s-2.5 4.5-6.5 4.5S1 7.5 1 7.5z" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="7.5" r="2" stroke="currentColor" stroke-width="1.3"/></svg></button>
              <button class="pwd-btn" title="生成" onclick="window.location.href='password-generator.html'"><svg viewBox="0 0 15 15" fill="none"><path d="M7.5 2v3m0 5v3M2 7.5h3m5 0h3M3.6 3.6l2.12 2.12m3.56 3.56l2.12 2.12M11.4 3.6l-2.12 2.12M5.72 9.28L3.6 11.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            </div>
          </div>
          <div class="strength-indicator" id="strength-ind">
            <div class="strength-bar-row" id="strength-bars"><span></span><span></span><span></span><span></span></div>
            <div class="strength-text" id="strength-text"></div>
          </div>
        </div>

        <div class="form-section-divider"></div>

        <div class="form-group">
          <label class="form-label">标签</label>
          <div class="tag-selector">
            <button class="tag-option selected" onclick="this.classList.toggle('selected')">账户</button>
            <button class="tag-option" onclick="this.classList.toggle('selected')">服务器</button>
            <button class="tag-option" onclick="this.classList.toggle('selected')">令牌</button>
            <button class="tag-option" onclick="this.classList.toggle('selected')">开发</button>
            <button class="tag-option" onclick="this.classList.toggle('selected')">主要</button>
            <button class="tag-option" onclick="this.classList.toggle('selected')">工作</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">两步验证密钥（可选）</label>
          <input class="form-input mono" type="text" placeholder="JBSWY3DPEHPK3PXP" data-od-id="field-totp">
        </div>

        <div class="form-group">
          <label class="form-label">备注（可选）</label>
          <textarea class="form-input" placeholder="添加备注信息…" data-od-id="field-notes"></textarea>
        </div>

        <div class="form-actions">
          <button class="btn btn-ghost" onclick="window.location.href='vault-home.html'">取消</button>
          <button class="btn btn-primary" onclick="showToast('凭证已保存')">
            <svg viewBox="0 0 15 15" fill="none"><path d="M3 7.5l3.5 3.5L12 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            保存凭证
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000)}
function togglePwd(){var i=document.getElementById('pwd-input');i.type=i.type==='password'?'text':'password'}
function updateStrength(){
  var p=document.getElementById('pwd-input').value;
  var bars=document.getElementById('strength-bars');
  var txt=document.getElementById('strength-text');
  if(!p){bars.className='strength-bar-row';txt.textContent='';txt.className='strength-text';return}
  var s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
  if(s>=4){bars.className='strength-bar-row strong';txt.textContent='强密码';txt.className='strength-text strong'}
  else if(s>=2){bars.className='strength-bar-row medium';txt.textContent='中等强度';txt.className='strength-text medium'}
  else{bars.className='strength-bar-row weak';txt.textContent='弱密码';txt.className='strength-text weak'}
}
</script>
</body>
</html>
